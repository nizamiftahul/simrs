spring.application.name=simrs

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/simrs}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:simrs}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:simrs}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

simrs.security.jwt.secret=${SIMRS_JWT_SECRET:}
simrs.security.jwt.access-token-ttl-minutes=15
simrs.security.jwt.refresh-token-ttl-days=7
simrs.security.jwt.issuer=simrs

simrs.security.cors.allowed-origins=${SIMRS_CORS_ALLOWED_ORIGINS:http://localhost:3000}
